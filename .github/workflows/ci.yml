name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify game and deployment build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      PUBLICATION_ORIGIN: https://zephyrwing-ai.github.io/paintwar
      SHOTS_DIR: shots
      SMOKE_SKIP_CHAT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run client tests
        run: pnpm test

      - name: Run server tests
        run: pnpm test:server

      - name: Build production site
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke test
        run: pnpm smoke

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
